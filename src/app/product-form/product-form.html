<div class="bg-white rounded-xl shadow-lg p-6 mb-8">
  <h2>Add New Product</h2>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
  <label>Name</label>
  <input formControlName="name" />
  <p class="error" *ngIf="isInvalid('name')">Name is required (min 3 chars).</p>

  <label>Description</label>
  <textarea formControlName="description"></textarea>
  <p class="error" *ngIf="isInvalid('description')">
    Description is required (min 10 chars).
  </p>

  <label>Price</label>
  <input type="number" formControlName="price" />
  <p class="error" *ngIf="isInvalid('price')">Price is required (min 50).</p>

  <label>Category</label>
  <select formControlName="category">
    <option [ngValue]="null" disabled>Select category</option>
    <option *ngFor="let category of categories" [ngValue]="category.id">
      {{ category.name }}
    </option>
  </select>
  <p class="error" *ngIf="isInvalid('category')">Category is required.</p>

  <label>Image URL</label>
  <input formControlName="imageUrl" />
  <p class="error" *ngIf="isInvalid('imageUrl')">
    Image URL is required and must start with http(s).
  </p>

  <label class="row">
    <input type="checkbox" formControlName="inStock" />
    In Stock
  </label>

  <label>Rating (0 - 5)</label>
  <input type="number" formControlName="rating" min="0" max="5" />
  <p class="error" *ngIf="isInvalid('rating')">Rating must be 0 to 5.</p>

  <h3>Properties</h3>

  <div formArrayName="properties">
    <div class="property" *ngFor="let prop of properties.controls; let i = index" [formGroupName]="i">
      <input placeholder="Color" formControlName="color" />
      <p class="error" *ngIf="propertyIsInvalid(i, 'color')">Color is required.</p>

      <input placeholder="Weight" formControlName="weight" />
      <p class="error" *ngIf="propertyIsInvalid(i, 'weight')">Weight is required.</p>

      <button type="button" (click)="removeProperty(i)" [disabled]="properties.length === 1">
        Remove Property
      </button>
    </div>
  </div>

  <button type="button" (click)="addProperty()">Add Property</button>

  <button type="submit" [disabled]="productForm.invalid || submitting">
    {{ submitting ? 'Creating...' : 'Create Product' }}
  </button>

  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
</form>

</div>
