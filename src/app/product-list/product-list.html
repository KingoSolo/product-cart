<div class="w-full">
  <!-- Loading State -->
  <div *ngIf="loading()" class="flex flex-col justify-center items-center py-20">
    <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>
    <p class="text-xl text-gray-600 font-medium">Loading products...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="!loading() && error()" class="max-w-2xl mx-auto my-8">
    <div class="bg-red-50 border-l-4 border-red-500 p-6 rounded-lg shadow-md">
      <div class="flex items-start">
        <svg class="w-8 h-8 text-red-500 mr-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <div class="flex-1">
          <h3 class="text-lg font-semibold text-red-800 mb-2">Error Loading Products</h3>
          <p class="text-red-700">{{ error() }}</p>
          <button 
            (click)="retryLoad()"
            class="mt-4 px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors duration-200 font-medium">
            Retry
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!loading() && !error() && isEmpty()" class="text-center py-20 bg-white rounded-lg shadow-md">
    <div class="text-8xl mb-4">📦</div>
    <h3 class="text-2xl font-semibold text-gray-700 mb-2">No Products Available</h3>
    <p class="text-gray-500">Check back later for new products!</p>
  </div>

  <!-- Success State - Product Grid -->
  <div *ngIf="!loading() && !error() && !isEmpty()">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-3xl font-bold text-gray-800">
        Products 
        <span class="text-gray-500 text-xl ml-2">({{ products().length }})</span>
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div *ngFor="let product of products()" 
           class="bg-white rounded-xl shadow-md hover:shadow-2xl transition-all duration-300 overflow-hidden group">
        
        <div class="h-64 bg-gray-50 flex items-center justify-center p-4 overflow-hidden">
          <img [src]="product.image" 
               [alt]="product.title" 
               class="max-h-full max-w-full object-contain group-hover:scale-110 transition-transform duration-300">
        </div>

        <div class="p-5">
          <h3 class="text-lg font-semibold text-gray-800 line-clamp-2 h-14 mb-2">
            {{ product.title }}
          </h3>
          
          <p class="text-sm text-gray-600 line-clamp-2 mb-4">
            {{ product.description }}
          </p>

          <div class="flex items-center justify-between mb-4">
            <span class="text-2xl font-bold text-blue-600">
              {{ product.price | currency }}
            </span>
            
            <span *ngIf="product.rating" class="text-sm text-gray-500 flex items-center gap-1">
              <span class="text-yellow-500">⭐</span>
              {{ product.rating.rate }} ({{ product.rating.count }})
            </span>
          </div>

          <button 
            (click)="addToCart(product)"
            class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 px-4 rounded-lg hover:from-blue-700 hover:to-blue-800 transition-all duration-200 font-semibold shadow-md hover:shadow-lg">
            Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
